<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>黑马点评</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/info.css" rel="stylesheet">

  <style type="text/css">
      .el-tabs--bottom .el-tabs__item.is-bottom:nth-child(2), .el-tabs--bottom .el-tabs__item.is-top:nth-child(2), .el-tabs--top .el-tabs__item.is-bottom:nth-child(2), .el-tabs--top .el-tabs__item.is-top:nth-child(2) {
          padding-left: 15px;
      }
      .el-tabs, .el-tab-pane{
          height: 100%;
      }
      .el-tabs__header{
          height: 10%;
      }
      .el-tabs__content{
          height: 90%;
          overflow-y: auto;
      }
      .follow-button { border: 0; font: inherit; text-align: center; }
      button:disabled { opacity: .6; cursor: wait; }
      .common-pages { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; }
  </style>

</head>

<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="header-title">&nbsp;&nbsp;&nbsp;</div>
  </div>
  <div class="basic">
    <div class="basic-icon">
      <img :src="user.icon || '/imgs/icons/default-icon.png'" alt="">
    </div>
    <div class="basic-info">
      <div class="name">{{user.nickName}}</div>
      <span>杭州</span>
    </div>
    <button type="button" class="logout-btn follow-button" @click="follow"
            :disabled="followPending || !user.id" v-show="user.id !== loginUser.id">
      {{followButtonText()}}
    </button>
  </div>
  <div class="introduce">
    <span v-if="info.introduce"></span>
    <span v-else>这个人很懒，什么都没有留下</span>
  </div>
  <div class="content">
    <el-tabs v-model="activeName" @tab-click="handleClick">
      <el-tab-pane label="笔记" name="1">
        <p v-if="blogsError">{{blogsError}}</p>
        <div v-for="b in blogs" :key="b.id" class="blog-item">
          <div class="blog-img"><img :src="b.images.split(',')[0]" alt=""></div>
          <div class="blog-info">
            <div class="blog-title" v-html="b.title"></div>
            <div class="blog-liked"><img src="/imgs/thumbup.png" alt=""> {{b.liked}}</div>
            <div class="blog-comments"><i class="el-icon-chat-dot-round"></i> {{b.comments}}</div>
          </div>
        </div>
      </el-tab-pane>
      <el-tab-pane label="共同关注" name="2">
        <div>你们都关注了：</div>
        <p v-if="commonPending">正在查询…</p>
        <p v-if="commonError">{{commonError}} <button type="button" :disabled="commonPending" @click="queryCommonFollow(commonCurrent)">重试</button></p>
        <p v-if="commonLoaded && !commonPending && !commonError && !commonFollows.length">暂无共同关注</p>
        <div class="follow-info" v-for="u in commonFollows" :key="u.id">
          <div class="follow-info-icon" @click="toOtherInfo(u.id)">
            <img :src="u.icon || '/imgs/icons/default-icon.png'" alt="">
          </div>
          <div class="follow-info-name">
            <div class="name">{{u.nickName}}</div>
          </div>
          <div class="follow-info-btn" @click="toOtherInfo(u.id)">
              去主页看看
          </div>
        </div>
        <div class="common-pages">
          <button type="button" :disabled="commonPending || commonCurrent <= 1" @click="queryCommonFollow(commonCurrent - 1)">上一页</button>
          <span>第 {{commonCurrent}} 页</span>
          <button type="button" :disabled="commonPending || !commonHasNext" @click="queryCommonFollow(commonCurrent + 1)">下一页</button>
        </div>
      </el-tab-pane>
    </el-tabs>
  </div>
  <foot-bar :active-btn="0"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js?v=20261031-1"></script>
<script src="./js/follows.js?v=20261031-1"></script>
<script src="./js/footer.js"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      util,
      user: {},
      loginUser: {},
      activeName: "1",
      info: {},
      blogs: [],
      blogsError: "",
      followed: false, // 是否关注了
      followPending: false,
      followReady: false,
      followRetryIntent: null,
      commonFollows: [], // 共同关注
      commonCurrent: 1,
      commonPending: false,
      commonHasNext: false,
      commonLoaded: false,
      commonError: "",
    },
    created() {
      this.queryLoginUser().then(loggedIn => { if (loggedIn) return this.queryUser(); });
    },
    methods: {
      queryBlogs() {
        return axios.get("/blog/of/user", {
            params: {id: this.user.id, current: 1}
          })
          .then(({data}) => this.blogs = data)
          .catch(() => { this.blogsError = "笔记暂时无法加载"; })
      },
      queryLoginUser() {
        // 查询用户信息
        return axios.get("/user/me")
          .then(({data}) => {
            // 保存用户
            this.loginUser = data;
            return true;
          })
          .catch(err => { this.$message.error(err.message || err); return false; })
      },
      queryUser() {
        // 查询用户信息
        let id = util.getUrlParam("id")
        return axios.get("/user/" + id)
          .then(({data}) => {
            // 保存用户
            this.user = data;
            if (this.user.id === this.loginUser.id) {
              location.href = "/info.html";
              return;
            }
            // 查询用户详情
            this.queryUserInfo();
            // 查询用户笔记
            this.queryBlogs();
            // 是否被关注
            this.isFollowed();
          })
          .catch(err => this.$message.error(err.message || err))
      },
      goBack() {
        history.back();
      },
      queryUserInfo(id) {
        axios.get("/user/info/" + this.user.id)
          .then(({data}) => {
            if (!data) {
              return
            }
            // 保存用户详情
            this.info = data;
            // 保存到本地
            sessionStorage.setItem("userInfo", JSON.stringify(data))
          })
          .catch(err => {
            this.$message.error(err);
          })
      },
      isFollowed(){
        return follows.refresh(this, this.user.id);
      },
      async queryCommonFollow(current = 1) {
        if (!this.user.id || this.commonPending || !Number.isInteger(current) || current < 1 || current > 1000) return false;
        const targetId = this.user.id;
        this.commonPending = true;
        this.commonError = "";
        try {
          const {data} = await axios.get("/follow/common/" + targetId, {params: {current}});
          if (this.user.id !== targetId) return false;
          if (!Array.isArray(data) || data.length > 5) throw new Error("共同关注返回异常");
          this.commonFollows = data;
          this.commonCurrent = current;
          this.commonHasNext = data.length === 5 && current < 1000;
          this.commonLoaded = true;
          return true;
        } catch (err) {
          this.commonError = err.message || err;
          this.$message.error(this.commonError);
          return false;
        } finally {
          this.commonPending = false;
        }
      },
      follow() {
        return follows.toggle(this, this.user.id);
      },
      followButtonText() {
        return follows.label(this);
      },
      handleClick(t) {
        if (t.name === '2') {
          this.queryCommonFollow();
        }
      },
      toOtherInfo(id){
        location.href = "/other-info.html?id=" + id
      }
    },

  })
</script>
</body>

</html>

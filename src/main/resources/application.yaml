server:
  port: 8081
spring:
  application:
    name: hmdp
  config:
    # 从项目根目录的本地密钥文件导入配置；optional 表示文件不存在时不报错（便于他人克隆后启动）
    import: optional:file:./config/application-secret.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    # 密码不写死：由 config/application-secret.yml 提供，该文件已被 .gitignore 忽略
    password: "${hmdp.datasource.password:}"
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
hmdp:
  id-generator:
    # 默认 1/1 仅供本机单实例使用，多实例须配置不同的编号组合（各为 0～31）。
    worker-id: ${HMDP_ID_WORKER_ID:1}
    datacenter-id: ${HMDP_ID_DATACENTER_ID:1}
